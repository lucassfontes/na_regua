<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#18181b"><link rel="icon" type="image/png" href="icons/icon-192.png?v=1.1.56"><link rel="apple-touch-icon" href="icons/icon-192.png?v=1.1.56"><link rel="manifest" href="manifest.json?v=1.1.56"><link rel="stylesheet" href="css/app.css?v=1.1.56"><title>Agendamento</title></head><body>
<header class="topbar"><div class="container topbar-inner"><div class="brand"><div class="brand-mark">✂</div><span id="bookingTenantName">Agendamento</span></div><button id="installApp" class="btn btn-sm btn-outline hidden" onclick="installApp()">Instalar app</button></div></header>
<main class="container page" id="bookingRoot"><div class="hero"><div><h1>Reserve seu horário</h1><p>Escolha serviço, profissional, dia e horário.</p></div></div><div id="bookingSteps" class="stack"><section class="card"><h2>1. Serviço</h2><div id="services" class="grid grid-2"></div></section><section id="barberSection" class="card hidden"><h2>2. Barbeiro</h2><div id="barbers" class="grid grid-2"></div></section><section id="dateSection" class="card hidden"><h2>3. Data e horário</h2><div class="field"><label>Data</label><input id="bookingDate" class="input" type="date"></div><div id="slots" class="slot-grid" style="margin-top:12px"></div></section><section id="customerSection" class="card hidden"><h2>4. Seus dados</h2><p class="muted small">Horário selecionado: <strong id="selectedTime"></strong></p><form id="bookingForm" class="stack"><div class="field"><label>Nome</label><input class="input" name="customerName" required></div><div class="field"><label>WhatsApp / telefone</label><input class="input" name="customerPhone" required></div><div class="field"><label>E-mail (opcional)</label><input class="input" name="customerEmail" type="email"></div><button class="btn" id="bookBtn">Confirmar agendamento</button></form></section></div><section id="successBox" class="card hidden" style="text-align:center"><div style="font-size:52px">✓</div><h2>Agendamento confirmado</h2><p class="muted">Sua reserva foi criada com sucesso.</p><div class="small muted">Código: <span id="successId"></span></div><a class="btn" style="margin-top:14px" href="javascript:location.reload()">Novo agendamento</a></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js?v=1.1.56"></script><script src="js/supabase-client.js?v=1.1.56"></script><script src="js/common.js?v=1.1.56"></script><script src="js/booking.js?v=1.1.56"></script><script src="js/pwa.js?v=1.1.56"></script></body></html>
